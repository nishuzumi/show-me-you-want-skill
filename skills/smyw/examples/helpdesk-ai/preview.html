/* marks on wireframes */
.mk-added{outline:2px solid var(--green);background-color:var(--green-bg)!important}
.mk-removed{outline:2px solid var(--red);background-color:var(--red-bg)!important}
.mk-modified{outline:2px solid var(--yel);background-color:var(--yel-bg)!important}
.mk-u{outline-width:3px!important;outline-offset:4px}
.cv-frame.mk-u{outline-offset:6px}
.mk-inner{outline-width:2px;outline-offset:1px}
.mk-inner.mk-added{outline-style:solid}.mk-inner.mk-removed{outline-style:dashed}
.mk-d{outline-offset:2px}
.mk-d.mk-modified.side-before{outline-style:dashed}
.wf.t-button.v-primary.mk{color:var(--ink);background-color:#fff}
.wf.t-button.v-primary.mk .wf-fn{background:#f5f2fb;color:#5b4b8a}
.mk-removed.mk-u>.wf-children,.mk-removed.mk-u>.wf-cap,.mk-removed.mk-u>.wf-lbl,.mk-removed.mk-u>.wf-text{opacity:.75}
.u-num{position:absolute;top:-15px;left:-15px;z-index:6;min-width:26px;height:26px;padding:0 6px;border-radius:13px;color:#fff;font-weight:700;font-size:14px;line-height:26px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.u-tag{position:absolute;top:-11px;left:16px;z-index:5;font-size:11px;line-height:17px;padding:0 6px;border-radius:4px;color:#fff;font-weight:600;pointer-events:none;white-space:nowrap}
.u-added{background:var(--green)}.u-removed{background:var(--red)}.u-modified{background:var(--yel);color:#2f2400}
.u-dot{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;color:#fff;font-weight:700;font-size:12px}
.wf-comp{display:none;position:absolute;top:-9px;right:8px;z-index:3;font:10px/15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#4a4f57;background:#eef0f3;border:1px solid #dcdfe5;border-radius:3px;padding:0 4px;pointer-events:none;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.show-comp .wf-comp,.dt-render .wf-comp{display:block}
.cv-vp:not(.show-fn) .wf-fn{display:none}
.wf-same{font-size:11px;color:var(--faint);margin-top:2px}
.fade .wf.is-leaf:not(.in-chg):not(.mk),.fade .wf.is-c:not(.in-chg):not(.mk)>.wf-cap,.fade .wf:not(.in-chg)>.wf-same{opacity:.35}
/* layout */
.main.main-canvas{padding:0;overflow:hidden;display:flex}
.cv-layout{display:flex;flex:1;min-width:0;min-height:0}
.cv-list{width:290px;flex:none;border-right:1px solid var(--line2);background:#fff;overflow:auto;padding:12px 12px 40px}
.cv-sum summary{cursor:pointer;font-weight:600;margin-bottom:4px}
.cv-sum .summary{font-size:12px;margin:0 0 8px}
.cv-page{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;border:none;background:none;padding:8px 6px 4px;white-space:normal}
.cv-page:hover{background:none;color:var(--blue)}
.cv-item{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;white-space:normal;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;margin-bottom:2px}
.cv-item:hover{background:#f5f6f8}
.cv-item.on{border-color:#b9c6f3;background:var(--blue-bg)}
.cv-item-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.cv-item-t{font-weight:550}
.cv-item-n{font-size:11.5px;color:var(--muted)}
.cv-q{margin-top:14px;width:100%;white-space:normal;text-align:left;background:var(--amber-bg);border-color:#efd28f;color:#6f520f}
.cv-vp{flex:1;min-width:0;position:relative;overflow:hidden;background-color:#e9ebef;background-image:radial-gradient(#c9cdd5 1px,transparent 1px);background-size:22px 22px;cursor:grab;user-select:none}
.cv-vp.panning,.cv-vp.space{cursor:grabbing}
.cv-vp.editing{cursor:default}.cv-vp.editing.space{cursor:grab}
.cv-world{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-wrap:wrap;width:max-content;max-width:3600px;gap:140px;align-items:flex-start;padding:30px}
.cv-world.anim{transition:transform .35s ease}
.cv-group{display:flex;gap:48px;align-items:flex-start}
.cv-frame{position:relative;flex:none;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(20,24,32,.10)}
.cv-fh{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:15px;font-weight:650;cursor:pointer;position:relative;background:#fbfbfc;border-radius:12px 12px 0 0}
.cv-fb{padding:18px 16px 16px}
.cv-ov{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(20,24,32,.10);padding:12px}
.cv-ovh{font-size:12px;color:var(--purple);margin-bottom:12px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.cv-ovdrop{width:320px;border:2px dashed #b9c0cc;border-radius:10px;padding:18px;color:var(--muted);font-size:13px;text-align:center;background:rgba(255,255,255,.6)}
.cv-tools{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:default}
.cv-tools button{padding:2px 9px;border-color:transparent}
.cv-tools button.on{background:var(--ink);color:#fff}
.cv-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
.cv-sep{width:1px;height:18px;background:var(--line2);margin:0 2px}
.cv-hint{position:absolute;left:12px;bottom:10px;z-index:20;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px}
/* detail panel */
.inspector.dt{width:min(560px,44vw)}
.dt-nav{display:inline-flex;gap:4px;margin-left:auto;margin-right:8px}
.dt-nav button{padding:1px 8px;font-size:12px}
.dt-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.dt-unit{display:flex;flex-direction:column;gap:10px}
.dt-cmp{display:flex;flex-direction:column;gap:12px}
.dt-render{border:1px solid var(--line2);border-radius:8px;padding:16px 12px 12px;background:#fafbfc;overflow:auto;max-height:520px}
.dt-render .wf-fn{display:inline-block}
.dt-void{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--faint);background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#f3f3f3 8px,#f3f3f3 16px)}
.dt-block{border-top:1px solid var(--line2);padding-top:8px}
.dt-list{margin:0;padding-left:18px;font-size:12.5px}.dt-list li{padding:2px 0}
.dt-list.fns{list-style:none;padding-left:0}
.dt-sec{border-top:2px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.wf-stat.sm{font-size:14px}

/* ================= hard prototype theme (legacy chrome base) ================= */
:root{--ink:#111;--muted:#555;--faint:#8a8a8a;--line:#b5b5b5;--line2:#d4d4d4;--bg:#f0f0f0;--wf:#fff;--wf-line:#333;--blue:#1f4fd8;--blue-bg:#eaf0ff;--purple:#5b34a6}
body{background:var(--bg)}
.card,.frame,.cv-frame,.cv-ov,.cv-tools,.toast,.u-num,.wf.t-modal,.wf.t-drawer,.wf.t-popover,.wf.t-menu{box-shadow:none}
/* app chrome */
.top{border-bottom:1px solid var(--ink)}
.tabs{border-bottom:1px solid var(--ink)}
.tabs button.on{border-bottom-width:3px}
button{border:1px solid var(--ink);background:#fff;padding:3px 10px}
button:hover:not(:disabled){background:#e8e8e8}
.seg{border:1px solid var(--ink)}
.stage{border:1px solid currentColor}
.card{border:1px solid var(--ink)}
.inspector{border-left:1px solid var(--ink)}
.cv-list{border-right:1px solid var(--ink)}
input,select,textarea{border:1px solid #777}
.banner{border-bottom:1px solid var(--ink)}
.cv-item{border:1px solid transparent}
.cv-item.on{border-color:var(--ink);background:#fff}
.cv-q{border:1px solid var(--ink);background:#fff;color:var(--ink)}
.chip{border:1px solid currentColor;background:#fff}
.u-dot{border:1px solid rgba(0,0,0,.25)}
/* canvas */
.cv-vp{background-color:#ececec;background-image:linear-gradient(#dcdcdc 1px,transparent 1px),linear-gradient(90deg,#dcdcdc 1px,transparent 1px);background-size:24px 24px}
.cv-frame{border:1.5px solid var(--ink)}
.cv-fh{background:#fff;border-bottom:1px solid var(--ink);font-size:14px;font-weight:700}
.cv-fb{padding:16px}
.cv-ov{border:1.5px solid var(--ink);padding:10px}
.cv-ovdrop{border:1.5px dashed #666;background:#fff}
.cv-tools{border:1px solid var(--ink)}
.cv-tools button{border:none}
.cv-hint{background:#fff;border:1px solid var(--line)}
.u-num{top:-14px;left:-14px;min-width:24px;height:24px;line-height:24px;font-size:13px}
.u-tag{top:-10px;left:12px}
.u-sel{box-shadow:0 0 0 4px var(--blue)!important}
/* wireframes */
.wf{border:1px solid #333;background:#fff;padding:7px 9px}
.wf:hover{border-color:#000}
.wf.is-c{border-color:#888}
.wf-cap{font-weight:700;color:#111}
.wf-text{color:#222}
.wf.t-button{border:1.5px solid #111;background:#fff}
.wf.t-button.v-primary{background:#111;border-color:#111;color:#fff}
.wf.t-button.v-danger{border-color:#111}
.wf.t-badge,.wf.t-tag{border:1px solid #111;background:#fff}
.wf-field{border:1px solid #444;color:#999}
.wf-it{border:1px solid #999;background:#fff}
.wf-table{border:1px solid #444}
.wf-table .th{background:#ececec;border-bottom:1px solid #444;border-right:1px solid #ccc}
.wf-table .td{border-right:1px solid #eee}
.wf-table .td::after,.wf-bars i{background:#dcdcdc}
.wf-media{background-color:#fff;border:1px solid #444;background-image:linear-gradient(to top right,transparent calc(50% - .6px),#aaa 50%,transparent calc(50% + .6px)),linear-gradient(to bottom right,transparent calc(50% - .6px),#aaa 50%,transparent calc(50% + .6px))}
.wf-media span{background:#fff;padding:0 4px}
.wf.t-placeholder{background:#fff;border:1px dashed #777}
.wf-toggle{border:1px solid #333;background:#fff}
.wf.t-modal,.wf.t-drawer,.wf.t-popover,.wf.t-menu{border:2px solid #111}
.wf-fn{background:#fff;border:1px solid #c7bce3}
.wf-note{background:#fff;border-left:3px solid var(--yel);color:#4d3c00}
.wf-comp{background:#fff;border:1px solid #888}
.wf-empty{border:1px dashed #888}
.frame{border:1px solid #444}
.frame.void,.dt-void{background:#fff;border:1px dashed #888}
.dt-render{background:#fff;border:1px solid #888}
.ins-note{border-left:3px solid var(--yel);background:#fffdf3}
.diff{border:1px solid #888}
/* flows & backend */
.lane-h{border-bottom:2px solid #111;color:#111}
.lane-bg{background:#f6f6f6;border-left:1px solid #ddd;border-right:1px solid #ddd}
.step{border:1px solid #333;background:#fff}
.step.k-decision{border-style:dashed}
.step-n{background:#fff;border:1px solid #333;color:#111}
.mod{border:1px solid #333}
.be-item{border:1px solid #bbb}
.wf-media.chart{background-image:none}

/* narrow windows (e.g. DSH sidebar preview): canvas keeps the full width */
.cv-listbtn{display:none}
.cv-tools{flex-wrap:wrap;max-width:calc(100% - 20px)}
@media (max-width:1100px){
  .cv-layout{position:relative}
  .cv-listbtn{display:inline-block}
  .cv-list{display:none;position:absolute;left:0;top:0;bottom:0;z-index:40;width:min(300px,88%);border-right:1px solid var(--ink)}
  .cv-layout.list-open .cv-list{display:block}
  .inspector.dt{position:absolute;right:0;top:0;bottom:0;z-index:35;width:min(520px,92%);border-left:1px solid var(--ink)}
  .top h1{font-size:14px}
  .cv-hint{right:10px}
}

/* pointer drag */
.cv-vp{touch-action:none}
.cv-vp.editing [data-drag]{cursor:move}
.is-dragging,.is-dragging *{cursor:grabbing!important}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;background:#111;color:#fff;padding:2px 8px;font-size:12px;white-space:nowrap}
.drag-ghost.no{background:#888}
.pal-item{touch-action:none}

/* trigger → overlay connectors */
.cv-links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:15}
.cv-link{fill:none;stroke-width:2.5;opacity:.85}
.cv-link.dashed{stroke-dasharray:8 6}
.cv-link.on{stroke-width:4;opacity:1}
.trig-list{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto;border:1px solid var(--line);padding:4px 6px;color:var(--ink)}
.trig-opt{display:flex;align-items:center;gap:4px;font-size:12px}

/* ---------------- interactions & play (prototype) mode ---------------- */
.is-trigger>.wf-lbl::after{content:none}
.wf.is-trigger::after{content:"▸";position:absolute;top:0;right:3px;color:var(--purple);font-weight:700;font-size:11px;line-height:14px;pointer-events:none}
.wf-cond{border-style:dashed!important;border-color:var(--purple)!important}
.cond-tag,.st-tag{position:absolute;bottom:-9px;z-index:3;font-size:10px;line-height:15px;padding:0 5px;background:#fff;border:1px solid var(--purple);color:var(--purple);pointer-events:none;white-space:nowrap}
.cond-tag{right:8px}.st-tag{left:8px}
.cv-link-lab{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;text-anchor:middle;dominant-baseline:middle}
.cv-link:not(.on){opacity:.8}
.play-btn{border-color:var(--purple);color:var(--purple);font-weight:700}
.play-btn:hover:not(:disabled){background:#f3effb}
.play-btn.on{background:var(--purple);color:#fff}
.body.pl{display:flex}
.pl-side{width:290px;flex:none;border-right:1px solid var(--ink);background:#fff;overflow:auto;padding:12px 12px 40px;display:flex;flex-direction:column;gap:6px}
.pl-side .sec-t{margin-top:8px}
.pl-ia{padding-left:16px}.pl-ia li{margin-bottom:5px}.pl-ia .lnk{font-weight:600;text-align:left;white-space:normal}
.pl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-bar{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--ink);background:#fff;flex-wrap:wrap}
.pl-stage{flex:1;overflow:auto;background:#3a3a3a;padding:24px}
.pl-wrap{margin:0 auto;position:relative}
.pl-frame{position:relative;background:#fff;border:1.5px solid #111;transform-origin:0 0}
.pl-fh{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid #111;font-size:14px;font-weight:700}
.pl-fb{padding:16px}
.pl-frame .wf{cursor:default}
.pl-frame [data-ia]{cursor:pointer}
.pl-frame [data-ia]:hover{outline:2px solid rgba(31,79,216,.55);outline-offset:1px}
.pl-frame.pl-hint [data-ia]{outline:2px solid #1f4fd8!important;outline-offset:1px;background-color:rgba(31,79,216,.14)!important}
.pl-back{position:absolute;inset:0;z-index:30}
.pl-back.dim{background:rgba(0,0,0,.4)}
.pl-back-modal{display:flex;justify-content:center;align-items:flex-start}
.pl-back-modal .pl-ov{position:sticky;top:40px;margin-top:70px}
.pl-back-drawer{display:flex;justify-content:flex-end}
.pl-back-drawer .pl-ov{min-height:100%;border-width:0 0 0 2px}
.pl-back-menu .pl-ov,.pl-back-popover .pl-ov{position:absolute}
.pl-ov{background:#fff;border:2px solid #111;padding:10px;max-width:92%}
.pl-void{padding:80px;text-align:center;color:var(--faint);border:1px dashed #888}
.pl-frame .wf-fn,.pl-frame .wf-same,.pl-frame .cmt-badge{display:none}

/* click-revealed slot & panel borders */
.wf.wf-slot{border:1.5px dashed var(--purple);background:#faf8ff;color:var(--purple);font-size:12px;padding:6px 9px;cursor:pointer}
.cv-rev{border-style:dashed}
.cv-rev>.cv-ovh{color:var(--purple)}
.pl-side>*{flex:none}

/* split (Git-style side-by-side) canvas diff + comparison box + red->green bridge */
.cv-world.is-split{flex-direction:column;flex-wrap:nowrap;max-width:none;gap:96px}
.cv-cmp-box{background:rgba(255,255,255,.78);border:1.5px solid #cbd5e1;border-radius:14px;padding:16px 20px 22px;box-shadow:0 4px 18px rgba(15,23,42,.06);flex:none}
.cv-cmp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #e2e8f0;cursor:pointer}
.cv-cmp-title{display:flex;align-items:center;gap:8px;font-size:15px}
.cv-cmp-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:#64748b;font-weight:600}
.cv-leg-b{color:var(--red)}.cv-leg-a{color:var(--green)}
.cv-pair{display:flex;gap:0;align-items:stretch;flex:none}
.cv-bridge{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;user-select:none}
.cv-bridge::before{content:"";position:absolute;top:16px;bottom:16px;width:2px;background:repeating-linear-gradient(to bottom,#cbd5e1 0 6px,transparent 6px 12px)}
.cv-bridge-arrow{position:relative;z-index:2;width:44px;height:44px;border-radius:999px;background:linear-gradient(135deg,var(--red),var(--green));color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 4px 14px rgba(15,23,42,.18)}
.cv-bridge-lbl{position:relative;z-index:2;margin-top:6px;font-size:11px;font-weight:650;color:#475569;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:1px 8px;white-space:nowrap}
.cv-seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:7px;overflow:hidden;background:#f8fafc}
.cv-seg button{border:none;border-right:1px solid #e2e8f0;border-radius:0;padding:3px 10px;background:transparent;color:#475569;font-size:12px}
.cv-seg button:last-child{border-right:none}
.cv-seg button.on{background:#18181b;color:#fff;font-weight:600}
.cv-frame.cv-void{border-style:dashed;border-color:#cbd5e1;background:#f8fafc}
.cv-frame.cv-void.cv-before{border-top:4px dashed var(--red)}
.cv-frame.cv-void.cv-after{border-top:4px dashed var(--green)}
.cv-void-body{min-height:220px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px}
.cv-side-tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid currentColor;line-height:1.4;flex:none}
.cv-side-tag.before{color:var(--red);background:var(--red-bg)}
.cv-side-tag.after{color:var(--green);background:var(--green-bg)}
.cv-frame.cv-before .mk-modified.mk-u,.cv-frame.cv-before .mk-modified.mk-inner{outline-style:dashed}
.cv-ov.cv-ov-before{border-color:var(--red)}
.cv-vp.editing .cv-frame.cv-before .cv-fb{opacity:.92}

/* ================= v3: real-UI styling, project theme tokens, clean/diff modes, Figma pins ================= */
:root{
  --ui-bg:#fafafa;--ui-fg:#18181b;--ui-card:#ffffff;--ui-card-fg:#18181b;
  --ui-primary:#18181b;--ui-primary-fg:#ffffff;
  --ui-secondary:#f4f4f5;--ui-secondary-fg:#18181b;
  --ui-muted:#f4f4f5;--ui-muted-fg:#71717a;
  --ui-destructive:#dc2626;--ui-border:#e4e4e7;--ui-input:#d4d4d8;--ui-ring:#3e63dd;
  --ui-radius:6px;--ui-font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
/* smoother app chrome */
button{border-radius:6px;border-color:#d4d4d8}
.top,.tabs,.banner,.inspector,.cv-list{border-color:#e4e4e7}
.cv-tools{border:1px solid #d4d4d8;border-radius:10px;padding:4px 6px;gap:5px;box-shadow:0 4px 14px rgba(15,23,42,.08)}
.cv-tools>button{border-radius:6px;font-size:12px;padding:3px 8px}
.cv-vp{background-color:#f1f5f9;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:20px 20px}
.cv-hint{border-radius:8px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(15,23,42,.06)}
.cv-item{border-radius:7px}.cv-item.on{border-color:#c7d2fe;background:#eef2ff}
.chip{border-radius:999px;border:none;padding:1px 7px}
.stage{border-radius:999px}.u-dot{border-radius:999px;border:none}
.cv-ov{border:1px solid #d4d4d8;border-radius:10px;box-shadow:0 4px 16px rgba(15,23,42,.08);padding:12px;background:#fff}

/* prototype screen frames */
.cv-frame,.pl-frame{background:var(--ui-bg);color:var(--ui-fg);font-family:var(--ui-font);border:1px solid var(--ui-border);border-radius:calc(var(--ui-radius) + 4px);box-shadow:0 2px 10px rgba(15,23,42,.06);overflow:visible}
.cv-frame.cv-before{border-top:4px solid var(--red)}
.cv-frame.cv-after{border-top:4px solid var(--green)}
.cv-fh,.pl-fh{background:var(--ui-card);border-bottom:1px solid var(--ui-border);border-radius:calc(var(--ui-radius) + 3px) calc(var(--ui-radius) + 3px) 0 0;padding:10px 16px;font-size:13.5px;font-weight:650;color:var(--ui-fg)}
.cv-fb,.pl-fb{padding:20px;background:var(--ui-bg);border-radius:0 0 calc(var(--ui-radius) + 3px) calc(var(--ui-radius) + 3px)}
.dt-render{background:var(--ui-bg);border:1px solid var(--ui-border);border-radius:8px;padding:14px}

/* real-UI component surfaces (transparent layout wrappers, crisp surfaces for cards/inputs/buttons) */
.cv-fb .wf,.pl-fb .wf,.cv-ov .wf,.dt-render .wf{border:none;background:transparent;padding:0;border-radius:var(--ui-radius);color:var(--ui-fg)}
.cv-fb .wf:hover,.pl-fb .wf:hover{border-color:transparent}
.cv-vp.editing .wf:hover,.cv-vp.diff-mode .wf:hover{box-shadow:0 0 0 1.5px rgba(62,99,221,.35)}
.wf-children{gap:12px}
.wf.t-col>.wf-children{gap:5px}
.wf.t-card,.wf.t-panel{background:var(--ui-card);color:var(--ui-card-fg);border:1px solid var(--ui-border);border-radius:calc(var(--ui-radius) + 2px);padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.wf.t-sidebar{background:var(--ui-card);border:1px solid var(--ui-border);border-radius:calc(var(--ui-radius) + 2px);padding:14px}
.wf.t-modal,.wf.t-drawer,.wf.t-popover,.wf.t-menu{background:var(--ui-card);color:var(--ui-card-fg);border:1px solid var(--ui-border);border-radius:calc(var(--ui-radius) + 3px);padding:16px;box-shadow:0 10px 28px rgba(15,23,42,.12)}
.wf.t-header{padding:0 0 14px;border-bottom:1px solid var(--ui-border);border-radius:0}
.wf.t-footer{padding:12px 0 0;border-top:1px solid var(--ui-border);border-radius:0}
.wf.t-section,.wf.t-form,.wf.t-group{padding:2px 0}
.wf.t-placeholder{background:var(--ui-muted);border:1px dashed var(--ui-input);padding:14px;border-radius:var(--ui-radius)}

/* typography */
.wf-h{font-size:20px;font-weight:700;line-height:1.3;color:var(--ui-fg);letter-spacing:-.01em}
.wf-text{font-size:13px;color:var(--ui-muted-fg);line-height:1.5}
.wf-cap{font-size:13.5px;font-weight:650;color:var(--ui-fg);margin-bottom:10px}
.wf-stat{font-size:18px;font-weight:700;color:var(--ui-fg);line-height:1.25}
.wf-sub{font-size:12px;color:var(--ui-muted-fg);margin-top:2px}
.wf-flabel{font-size:12px;font-weight:500;color:var(--ui-muted-fg);margin-bottom:5px}

/* semantic alignment */
.wf.t-header>.wf-children{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wf.t-header>.wf-children>.wf.t-col{flex:1 1 320px}
.wf.t-header>.wf-children>.wf.t-toolbar{flex:0 0 auto}
.wf.t-toolbar>.wf-children{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
.wf.t-toolbar>.wf-children:has(.wf-flabel),.wf.t-form.lay-row>.wf-children,.wf.t-row>.wf-children:has(.wf-flabel){align-items:flex-end}
.wf.t-row>.wf-children{align-items:center;gap:10px}
.wf.t-footer>.wf-children{justify-content:flex-end;align-items:center;gap:8px}
.wf.lay-row>.wf-children>.wf.t-input,.wf.lay-row>.wf-children>.wf.t-select{flex:1 1 140px;min-width:120px}
.wf.lay-row>.wf-children>.wf.t-text{flex:1 1 200px}
.wf.lay-row>.wf-children>.wf.inline,.wf.lay-row>.wf-children>.wf.t-toolbar{flex:0 0 auto}
.wf.lay-grid>.wf-children{gap:12px;align-items:stretch}
.wf.lay-grid>.wf-children>.wf.t-card{display:flex;flex-direction:column;justify-content:space-between}

/* real interactive controls (34px height) */
.wf.t-button{height:34px;padding:0 13px;border:1px solid var(--ui-border);border-radius:var(--ui-radius);background:var(--ui-card);color:var(--ui-fg);font-size:13px;font-weight:500;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.wf.t-button:hover{background:var(--ui-secondary)}
.wf.t-button.v-primary{background:var(--ui-primary);border-color:var(--ui-primary);color:var(--ui-primary-fg)}
.wf.t-button.v-primary:hover{filter:brightness(1.06);background:var(--ui-primary)}
.wf.t-button.v-secondary{background:var(--ui-secondary);border-color:var(--ui-border);color:var(--ui-secondary-fg)}
.wf.t-button.v-danger{background:color-mix(in srgb,var(--ui-destructive) 8%,var(--ui-card));border-color:color-mix(in srgb,var(--ui-destructive) 35%,var(--ui-border));color:var(--ui-destructive)}
.wf.t-button.v-danger .wf-lbl{color:var(--ui-destructive)}
.wf.t-button.v-danger .wf-lbl::before{content:""}
.wf.t-button.v-ghost{background:transparent;border-color:transparent;color:var(--ui-fg)}
.wf.t-button.v-ghost:hover{background:var(--ui-secondary)}
.wf.t-link{padding:2px 0;height:auto;border:none;background:transparent}
.wf.t-link .wf-lbl{color:var(--ui-primary);text-decoration:none;font-size:12.5px;font-weight:500}
.wf.t-link:hover .wf-lbl{text-decoration:underline}
.wf.t-badge,.wf.t-tag{height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--ui-border);background:var(--ui-secondary);color:var(--ui-secondary-fg);font-size:11.5px;font-weight:550;display:inline-flex;flex-direction:row;align-items:center;justify-content:center}
.wf-input,.wf-select{height:34px;padding:0 10px;border:1px solid var(--ui-input);border-radius:var(--ui-radius);background:var(--ui-card);color:var(--ui-fg);font-size:13px;width:100%;outline:none}
.wf-input:focus,.wf-select:focus,.wf-textarea:focus{border-color:var(--ui-primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--ui-primary) 18%,transparent)}
.wf-textarea{min-height:68px;padding:8px 10px;border:1px solid var(--ui-input);border-radius:var(--ui-radius);background:var(--ui-card);color:var(--ui-fg);font-size:13px;width:100%;outline:none}
.wf-field.wf-upload{height:38px;border:1px dashed var(--ui-input);border-radius:var(--ui-radius);justify-content:center;color:var(--ui-muted-fg);background:var(--ui-card)}
.wf-check-lbl,.wf-switch-lbl,.wf-radio-opt{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ui-fg);cursor:pointer;min-height:30px}
.wf-toggle{width:32px;height:18px;border-radius:999px;background:#cbd5e1;border:none;position:relative;display:inline-block;transition:background .15s;flex:none}
.wf-toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform .15s}
.wf-toggle.on{background:var(--ui-primary)}
.wf-toggle.on::after{transform:translateX(14px)}
.wf-toggle-btn{height:30px;padding:0 10px;border-radius:var(--ui-radius);border:1px solid var(--ui-border);background:var(--ui-card);color:var(--ui-fg);font-size:12.5px}
.wf-toggle-btn.on{background:var(--ui-primary);color:var(--ui-primary-fg);border-color:var(--ui-primary)}
.wf-progress{height:8px;border-radius:999px;background:var(--ui-secondary)}
.wf-progress i{background:var(--ui-primary);border-radius:999px}
.wf-table{border:1px solid var(--ui-border);border-radius:var(--ui-radius);overflow:hidden;background:var(--ui-card)}
.wf-table .th{background:var(--ui-muted);color:var(--ui-muted-fg);font-size:12px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--ui-border);border-right:none}
.wf-table .td{height:32px;border-bottom:1px solid var(--ui-border);border-right:none}
.wf-table .td::after{top:13px;left:10px;height:6px;border-radius:3px;background:var(--ui-secondary)}
.wf-it{border:1px solid var(--ui-border);border-radius:var(--ui-radius);background:var(--ui-card);padding:3px 9px;font-size:12px;color:var(--ui-fg)}
.t-tabs>.wf-items{gap:4px;border-bottom:1px solid var(--ui-border);padding-bottom:6px}
.t-tabs>.wf-items .wf-it{border-radius:var(--ui-radius);border-color:transparent;background:transparent;color:var(--ui-muted-fg)}
.t-tabs>.wf-items .wf-it:first-child{background:var(--ui-secondary);color:var(--ui-fg);font-weight:600}

/* in-place interactive Tabs bar */
.wf-tabs-bar>.wf-children{flex-direction:row;align-items:center;gap:4px;border-bottom:1px solid var(--ui-border);padding-bottom:0;margin-bottom:2px}
.wf.wf-tab-btn{height:36px;padding:0 14px;border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--ui-muted-fg);font-weight:500;margin-bottom:-1px;cursor:pointer}
.wf.wf-tab-btn:hover{color:var(--ui-fg);background:color-mix(in srgb,var(--ui-secondary) 60%,transparent)}
.wf.wf-tab-btn.is-active-tab,.wf.wf-tab-btn.v-primary.is-active-tab{color:var(--ui-primary);border-bottom-color:var(--ui-primary);background:transparent;font-weight:650}
.wf.wf-tab-btn.v-primary:not(.is-active-tab){background:transparent;border-color:transparent;color:var(--ui-muted-fg)}

/* clean preview (default) vs diff mode (dim unchanged + highlight changed) */
.cv-vp.clean-mode .mk-added,.cv-vp.clean-mode .mk-removed,.cv-vp.clean-mode .mk-modified{outline:none!important;background-color:transparent!important}
.cv-vp.clean-mode .wf.t-card.mk,.cv-vp.clean-mode .wf.t-panel.mk,.cv-vp.clean-mode .wf.t-modal.mk,.cv-vp.clean-mode .wf.t-drawer.mk,.cv-vp.clean-mode .wf.t-popover.mk,.cv-vp.clean-mode .wf.t-menu.mk,.cv-vp.clean-mode .wf.t-sidebar.mk{background-color:var(--ui-card)!important}
.cv-vp.clean-mode .cv-frame.mk{background-color:var(--ui-bg)!important}
.cv-vp.clean-mode .wf.t-button.mk{background-color:var(--ui-card)!important;color:var(--ui-fg)!important}
.cv-vp.clean-mode .wf.t-button.v-primary.mk{background-color:var(--ui-primary)!important;color:var(--ui-primary-fg)!important}
.cv-vp.clean-mode .wf.t-button.v-secondary.mk{background-color:var(--ui-secondary)!important;color:var(--ui-secondary-fg)!important}
.cv-vp.clean-mode .wf.t-button.v-danger.mk{background-color:color-mix(in srgb,var(--ui-destructive) 8%,var(--ui-card))!important;color:var(--ui-destructive)!important}
.cv-vp.clean-mode .wf.t-button.v-ghost.mk{background-color:transparent!important}
.cv-vp.clean-mode .wf.wf-tab-btn.mk{background-color:transparent!important}
.cv-vp.clean-mode .wf.t-badge.mk,.cv-vp.clean-mode .wf.t-tag.mk{background-color:var(--ui-secondary)!important}
.cv-vp.clean-mode .u-num,.cv-vp.clean-mode .u-tag,.cv-vp.clean-mode .st-tag,.cv-vp.clean-mode .cond-tag,.cv-vp.clean-mode .wf.is-trigger::after{display:none!important}
.cv-vp.clean-mode .th.chg,.cv-vp.clean-mode .wf-it.chg{outline:none!important;background-color:transparent!important}
.cv-vp.clean-mode .th.chg{background-color:var(--ui-muted)!important}
.cv-vp.clean-mode .mk-removed.mk-u>*{opacity:1!important}
.cv-vp.diff-mode .st-tag,.cv-vp.diff-mode .cond-tag{display:none}
.cv-vp.diff-mode.fade .wf.is-leaf:not(.in-chg):not(.mk),.cv-vp.diff-mode.fade .wf.is-c:not(.in-chg):not(.mk)>.wf-cap,.cv-vp.diff-mode.fade .wf:not(.in-chg)>.wf-same{opacity:.32}
.cv-vp.diff-mode .u-num{border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.cv-vp.diff-mode .u-tag{border-radius:4px}

/* Figma-style floating comment pins (hover to read, zero layout clutter) */
.cv-vp.pins-off .cv-pin{display:none!important}
.cv-pin{position:absolute;top:-10px;right:-10px;z-index:12;min-width:22px;height:22px;padding:0 6px;border-radius:999px 999px 999px 3px;background:var(--ui-primary,#4f46e5);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(15,23,42,.24);cursor:pointer;user-select:none;transition:transform .12s}
.cv-pin.p-added{background:var(--green)}
.cv-pin.p-removed{background:var(--red)}
.cv-pin.p-modified{background:var(--yel);color:#2f2400}
.cv-pin.has-cmt{background:var(--purple);color:#fff}
.cv-pin:hover{transform:scale(1.12);z-index:45}
.cv-pin-pop{display:none;position:absolute;right:0;top:26px;width:290px;background:#fff;color:#18181b;border:1px solid #d4d4d8;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:400;line-height:1.5;text-align:left;white-space:normal;box-shadow:0 12px 32px rgba(15,23,42,.2);z-index:60;pointer-events:none}
.cv-pin:hover .cv-pin-pop{display:block}
.cv-pin-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px;font-size:12.5px}
.cv-pin-note{color:#3f3f46;margin-bottom:6px}
.cv-pin-diff{font-size:11.5px;color:#52525b;background:#fafafa;border:1px solid #e4e4e7;border-radius:5px;padding:4px 7px;margin-bottom:6px}
.cv-pin-code{display:block;font-size:10.5px;color:#5b4b8a;background:#f5f2fb;border-radius:4px;padding:2px 6px;margin-top:4px;word-break:break-all}
.cv-pin-cmts{border-top:1px solid #e4e4e7;margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:4px}
.cv-pin-cmt{font-size:11.5px;color:#18181b}
.cv-pin-foot{margin-top:6px;padding-top:5px;border-top:1px dashed #e4e4e7;font-size:10.5px;color:#94a3b8}

/* wipe (before/after slider) comparison */
.cv-wipe{position:relative;flex:none;user-select:none}
.cv-wipe-after{position:relative;z-index:1;isolation:isolate}
.cv-wipe-before{position:absolute;inset:0;pointer-events:none;clip-path:inset(0 calc(100% - var(--wipe,50%)) 0 0);z-index:10;isolation:isolate}
.cv-wipe-before>.cv-frame,.cv-wipe-before>.cv-ov{pointer-events:auto}
.cv-wipe-handle{position:absolute;top:-6px;bottom:-6px;left:var(--wipe,50%);transform:translateX(-50%);width:36px;z-index:30;cursor:ew-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
.cv-wipe-line{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:3px;background:linear-gradient(to bottom,var(--red),var(--ui-primary,#4f46e5),var(--green));box-shadow:0 0 0 1px rgba(255,255,255,.85)}
.cv-wipe-knob{position:relative;z-index:2;width:36px;height:36px;border-radius:999px;background:linear-gradient(135deg,var(--red),var(--green));color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 4px 14px rgba(15,23,42,.28)}
.cv-wipe-handle:hover .cv-wipe-knob{transform:scale(1.08)}
.cv-wipe-ctrl{display:inline-flex;align-items:center;gap:8px;font-size:12px}
.cv-wipe-range{width:140px;accent-color:var(--ui-primary,#4f46e5);cursor:pointer}
.cv-wipe-pct{min-width:34px;text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#64748b}

/* 4-side proximity docking for standalone interactive panel comparison boxes */
.cv-group.is-split,.cv-group.is-wipe,.cv-group.is-single{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto auto;gap:0;align-items:start;justify-items:center}
.cv-main-slot{grid-area:2/2}
.cv-dock[hidden]{display:none!important}
.cv-dock-t{grid-area:1/2;display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-end;margin-bottom:56px}
.cv-dock-l{grid-area:2/1;display:flex;flex-direction:column;gap:22px;align-items:flex-end;margin-right:72px}
.cv-dock-r{grid-area:2/3;display:flex;flex-direction:column;gap:22px;align-items:flex-start;margin-left:72px}
.cv-dock-b{grid-area:3/2;display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;margin-top:56px}
.cv-cmp-box.cv-ov-cmp{padding:12px 16px 16px;border-radius:12px;background:#fff}
.cv-ov-cmp-head{margin-bottom:12px;padding-bottom:8px;cursor:default;align-items:flex-start;flex-wrap:wrap}
.cv-ov-cmp-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.cv-ov-cmp-meta .cv-cmp-title{font-size:13.5px}
.cv-ov-bridge{width:56px}
.cv-ov-bridge .cv-bridge-arrow{width:34px;height:34px;font-size:17px}
.cv-ov-pair{align-items:stretch}
.cv-ov-pair>.cv-ov,.cv-ov-wipe .cv-ov{margin:0;box-shadow:none;border:1px solid var(--ui-border,#e4e4e7);background:var(--ui-bg,#fafafa)}
.cv-ov-pair>.cv-ov.cv-ov-before,.cv-ov-wipe .cv-ov.cv-ov-before{border-top:3px solid var(--red)}
.cv-ov-pair>.cv-ov.cv-ov-after,.cv-ov-wipe .cv-ov.cv-ov-after{border-top:3px solid var(--green)}
.cv-ov.cv-ov-void{border-style:dashed!important;background:#f8fafc!important;display:flex;flex-direction:column}
.cv-ov-void-body{flex:1;min-height:110px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12.5px}
.cv-ovh-side{margin-bottom:8px;justify-content:flex-start}
.cv-ov-solo{display:flex;flex-direction:column;gap:8px;background:#fff;border:1.5px solid #cbd5e1;border-radius:12px;padding:12px 14px 14px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
.cv-ov-solo.is-unchanged{border-color:#cbd5e1;background:#fff}
.cv-ov-solo>.cv-ov{margin:0;box-shadow:none;border:1px solid var(--ui-border,#e4e4e7);background:var(--ui-bg,#fafafa);padding:10px}
.cv-ov-trig{font-size:11.5px;color:var(--purple);display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.cv-ov-trig.muted{color:var(--faint)}
.cv-dock>.cv-ovdrop{width:320px;min-height:110px;display:flex;align-items:center;justify-content:center}

/* sticky inspector top bar & docked bottom comment box */
.inspector{padding:0;overflow:hidden;gap:0}
.inspector>.ins-top{flex:none;padding:10px 14px;border-bottom:1px solid #e4e4e7;background:#fff;z-index:6}
.ins-scroll{flex:1;min-height:0;overflow:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:10px}
.ins-foot{flex:none;border-top:1px solid #e4e4e7;background:#fafafa;padding:10px 14px 12px;box-shadow:0 -4px 14px rgba(15,23,42,.06);z-index:6}
.ins-foot .cbox{border-top:none;padding-top:0;gap:6px}
.ins-foot .cbox-list{max-height:110px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.ins-foot .cmt{margin-bottom:0}
.ins-foot textarea{min-height:46px;max-height:110px}

/* collapsible left sidebar (change list in view mode, visual component palette in edit mode) */
.cv-layout.list-collapsed .cv-list{display:none}
.cv-list-toggle{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:25;width:18px;height:48px;padding:0;border:1px solid #d4d4d8;border-left:none;border-radius:0 8px 8px 0;background:rgba(255,255,255,.94);color:var(--muted);font-size:15px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 8px rgba(15,23,42,.08);cursor:pointer;transition:background .12s,color .12s,width .12s}
.cv-list-toggle:hover{background:#fff;color:var(--ink);width:22px}
.pal-side{display:flex;flex-direction:column;gap:12px;padding:12px 12px 24px}
.pal-head{display:flex;flex-direction:column;gap:8px;position:sticky;top:-12px;margin:-12px -12px 0;padding:12px 12px 10px;background:#fff;border-bottom:1px solid #e4e4e7;z-index:4}
.pal-head-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pal-search{height:30px;padding:0 9px;font-size:12px;border:1px solid #d4d4d8;border-radius:7px;background:#fafafa}
.pal-search:focus{outline:none;border-color:var(--blue);background:#fff}
.pal-sec{display:flex;flex-direction:column;gap:6px}
.pal-sec-t{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:650;color:var(--muted);padding:0 2px}
.pal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal-side .pal-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 6px 6px;border:1px solid #e4e4e7;border-radius:9px;background:#fafafa;cursor:grab;user-select:none;transition:border-color .12s,background .12s,box-shadow .12s,transform .12s}
.pal-side .pal-item:hover{border-color:var(--blue);background:#fff;color:var(--blue);box-shadow:0 3px 10px rgba(62,99,221,.12);transform:translateY(-1px)}
.pal-side .pal-item:active{cursor:grabbing}
.pal-thumb{width:100%;height:46px;border-radius:6px;background:#fff;border:1px solid #eef0f4;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
.pal-thumb svg{display:block;width:88px;height:44px;max-width:100%;height:auto}
.pal-lbl{font-size:11.5px;font-weight:550;line-height:1.25;text-align:center;color:inherit;pointer-events:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-foot{margin-top:auto;padding-top:8px;border-top:1px solid #e4e4e7}
.drag-ghost.drag-ghost-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:9px;background:#fff;color:var(--ink);border:1.5px solid var(--blue);box-shadow:0 10px 26px rgba(15,23,42,.22);width:112px}
.drag-ghost.drag-ghost-card .pal-thumb{height:40px;border-color:#eef0f4}
.drag-ghost.drag-ghost-card.no{background:#f8fafc;color:var(--muted);border-color:#94a3b8;opacity:.85}
@media (max-width:1100px){
  .cv-list-toggle{display:none}
  .cv-layout.list-collapsed .cv-list{display:none}
  .cv-layout.list-open .cv-list{display:block}
}

/* ================= live agent floating dialog & minimized icon ================= */
.live-btn{display:inline-flex;align-items:center;gap:6px;border-color:var(--blue);color:var(--blue);font-weight:600}
.live-btn:hover:not(:disabled){background:var(--blue-bg)}
.live-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;flex:none}
.live-dot.on{background:var(--green)}
.live-dot.wait{background:var(--amber)}
.live-dot.busy{background:var(--blue);animation:livePulse 1.1s infinite ease-in-out}
.live-dot.off{background:var(--red)}
.live-btn.on .live-dot.on{background:#6ee7b7}
.live-btn.on .live-dot.busy{background:#fff}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
.live-dock{position:fixed;right:20px;bottom:20px;z-index:80;pointer-events:auto}
.live-fab{position:relative;width:50px;height:50px;padding:0;border-radius:999px;border:1px solid #18181b;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(15,23,42,.26);transition:transform .14s,box-shadow .14s,background .14s}
.live-fab:hover{background:#27272a;transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.32)}
.live-fab.is-busy{box-shadow:0 0 0 4px rgba(62,99,221,.28),0 8px 24px rgba(15,23,42,.26)}
.live-fab-dot{position:absolute;right:2px;bottom:2px;width:11px;height:11px;border:2px solid #fff}
.live-fab-cnt{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;line-height:19px;text-align:center;border:2px solid #fff}
.live-pane{width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 110px));border:1px solid #d4d4d8;border-radius:14px;background:#fff;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 14px 40px rgba(15,23,42,.18)}
.live-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #e4e4e7;background:#fff;flex:none}
.live-head-l{display:flex;align-items:center;gap:7px;min-width:0}
.live-head-r{display:flex;align-items:center;gap:6px;flex:none}
.live-close{border:none;background:none;font-size:15px;font-weight:700;line-height:1;padding:3px 7px;color:var(--muted);border-radius:6px}
.live-close:hover{background:#f4f4f5;color:var(--ink)}
.live-status-bar{padding:5px 12px;font-size:11.5px;color:var(--muted);background:#fafafa;border-bottom:1px solid #e4e4e7;flex:none}
.live-msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#f8fafc}
.live-empty{margin:auto 0;padding:18px 14px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:10px}
.live-empty-t{font-weight:650;color:var(--ink);margin-bottom:6px;font-size:13px}
.live-empty-s{font-size:12px;line-height:1.55}
.live-msg{display:flex;flex-direction:column;gap:4px;max-width:92%;padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.55;word-break:break-word}
.live-msg.is-user{align-self:flex-end;background:#18181b;color:#fff;border-bottom-right-radius:3px}
.live-msg.is-ai{align-self:flex-start;background:#fff;color:var(--ink);border:1px solid #e4e4e7;border-bottom-left-radius:3px}
.live-msg.is-sys{align-self:center;max-width:100%;background:var(--green-bg);color:#146c3e;border:1px solid #a3dfbd;font-size:12px;text-align:center}
.live-msg.is-err{background:var(--red-bg);color:#9b2c2c;border-color:#f2b8ba}
.live-msg-body{white-space:pre-wrap}
.live-msg-body code{background:rgba(15,23,42,.07);padding:0 4px;border-radius:3px;font-size:11.5px}
.live-msg.is-user .live-msg-body code{background:rgba(255,255,255,.16);color:#fff}
.live-msg-meta{display:flex;flex-wrap:wrap;gap:4px}
.live-tag{font-size:10.5px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.16);color:#e4e4e7}
.live-msg-acts{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.live-ver-jump{font-size:11.5px;padding:2px 8px;border-color:#b9c6f3;background:var(--blue-bg);color:var(--blue);font-weight:600}
.live-ver-jump:hover{background:#dfe7ff}
.live-thinking{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--blue);font-weight:550}
.live-spin{width:12px;height:12px;border:2px solid #c7d2fe;border-top-color:var(--blue);border-radius:50%;animation:liveSpin .8s linear infinite;flex:none}
@keyframes liveSpin{to{transform:rotate(360deg)}}
.live-foot{flex:none;border-top:1px solid #e4e4e7;background:#fff;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.live-ctx-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.live-ctx-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid #d4d4d8;background:#f4f4f5;color:#3f3f46;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-ctx-pill.on{border-color:#c7d2fe;background:var(--blue-bg);color:var(--blue);font-weight:550}
.live-ctx-pill.sync{border-color:#d8b4fe;background:#f5f2fb;color:var(--purple)}
.live-ctx-x{border:none;background:none;padding:0 2px;font-size:13px;line-height:1;color:inherit}
.live-ctx-x:hover{background:none;opacity:.7}
.live-compose{display:flex;gap:6px;align-items:flex-end}
.live-input{flex:1;min-height:42px;max-height:120px;resize:none;padding:7px 9px;font-size:12.5px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;line-height:1.45}
.live-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(62,99,221,.15)}
.live-send{height:36px;padding:0 13px;flex:none}
@media (max-width:1100px){
  .live-dock{right:12px;bottom:12px}
  .live-pane{width:min(360px,calc(100vw - 24px));height:min(480px,calc(100vh - 96px))}
}
</style>

    if (S.ops.length) bits.push(S.ops.length + ' 处画布修改');

    value: live.draft,

async function liveFetch(path, body) {
  const res = await fetch(path, {
    method: body !== undefined ? 'POST' : 'GET',
    headers: Object.assign({ 'X-SMYW-Token': live.token }, body !== undefined ? { 'Content-Type': 'application/json; charset=utf-8' } : {}),
    body: body !== undefined ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

async function sendLiveChat() {
  if (!live.enabled || live.busy || live.sseState === 'closed') return;
  const text = live.draft.trim();
  const patch = specPatch();
  const hasEdits = S.ops.length > 0 || S.comments.length > 0 || S.global.tags.length > 0 || !!S.global.text.trim() || Object.keys(S.answers || {}).length > 0 || patch.ops.length > 0;
  if (!text && !hasEdits) return;
  const ctx = liveSelContext();
  const payload = {
    text: text,
    context: ctx,
    hasEdits: hasEdits,
    opsCount: S.ops.length,
    commentsCount: S.comments.length,
    baseVersion: BASE.version,
    baseHash: BASE_HASH,
    patch: patch.ops.length ? patch : null,
    feedbackMarkdown: hasEdits ? buildMarkdown(false) : ''
  };
  live.draft = '';
  live.busy = true;
  live.busyStatus = '正在发送…';
  refreshLivePane(true);
  try {
    await liveFetch('/api/chat', payload);
  } catch (err) {
    live.busy = false;
    live.busyStatus = '';
    live.draft = text;
    toast('发送失败：' + err.message, true);
    refreshLivePane(false);
  }
}

async function approveLive() {
  if (!live.enabled || live.busy || live.sseState === 'closed') return;
  if (!live.approved && !live.confirmApprove) {
    live.confirmApprove = true;
    refreshLivePane(false);
    setTimeout(() => { if (live.confirmApprove) { live.confirmApprove = false; refreshLivePane(false); } }, 4000);
    return;
  }
  live.confirmApprove = false;
  const patch = specPatch();
  const hasEdits = S.ops.length > 0 || S.comments.length > 0 || S.global.tags.length > 0 || !!S.global.text.trim() || Object.keys(S.answers || {}).length > 0 || patch.ops.length > 0;
  try {
    S.approved = true;
    save();
    await liveFetch('/api/approve', {
      note: live.draft.trim(),
      hasEdits: hasEdits,
      opsCount: S.ops.length,
      commentsCount: S.comments.length,
      baseVersion: BASE.version,
      baseHash: BASE_HASH,
      feedbackMarkdown: hasEdits ? buildMarkdown(false) : ''
    });
    live.approved = true;
    toast('已通知 Agent 确认方案');
    refreshLivePane(true);
  } catch (err) {
    toast('确认失败：' + err.message, true);
  }
}

function connectLive() {
  if (!live.enabled || typeof EventSource === 'undefined') return;
  if (live.es) { try { live.es.close(); } catch (e) {} }
  const es = new EventSource('/api/events?token=' + encodeURIComponent(live.token));
  live.es = es;
  es.onopen = () => {
    live.sseState = 'open';
    refreshLivePane(false);
  };
  es.onerror = () => {
    if (live.sseState !== 'closed') {
      live.sseState = es.readyState === 2 ? 'closed' : 'connecting';
      refreshLivePane(false);
    }
  };
  es.addEventListener('init', (ev) => {
    try {
      const d = JSON.parse(ev.data);
      live.sseState = 'open';
      if (d.state) {
        live.agentConnected = !!d.state.agentConnected;
        live.busy = !!d.state.busy;
        live.busyStatus = d.state.busyStatus || '';
        live.approved = !!d.state.approved;
      }
      if (Array.isArray(d.messages)) live.messages = d.messages;
      live.stream = d.stream || null;
      refreshLivePane(true);
    } catch (e) {}
  });
  es.addEventListener('agent-state', (ev) => {
    try {
      const st = JSON.parse(ev.data);
      live.agentConnected = !!st.agentConnected;
      live.busy = !!st.busy;
      live.busyStatus = st.busyStatus || '';
      live.approved = !!st.approved;
      if (!live.busy) live.stream = null;
      refreshLivePane(false);
    } catch (e) {}
  });
  es.addEventListener('chunk', (ev) => {
    try {
      const d = JSON.parse(ev.data);
      if (!live.stream || live.stream.id !== d.id) live.stream = { id: d.id, text: '' };
      live.stream.text += d.delta || '';
      refreshLiveStream();
    } catch (e) {}
  });
  es.addEventListener('message', (ev) => {
    try {
      const d = JSON.parse(ev.data);
      const m = d && d.message;
      if (!m) return;
      const idx = live.messages.findIndex((x) => x.id === m.id);
      if (idx >= 0) live.messages[idx] = m;
      else live.messages.push(m);
      if (m.role !== 'user') {
        live.stream = null;
        if (!live.open) live.unread++;
      }
      refreshLivePane(true);
    } catch (e) {}
  });
  es.addEventListener('spec-updated', (ev) => {
    try {
      const d = JSON.parse(ev.data);
      if (d && d.spec) reloadSpec(d.spec, d.versions);
    } catch (e) {}
  });
  es.addEventListener('shutdown', () => {
    live.sseState = 'closed';
    live.busy = false;
    live.agentConnected = false;
    try { es.close(); } catch (e) {}
    refreshLivePane(false);
    toast('实时预览服务已关闭');
  });
}
